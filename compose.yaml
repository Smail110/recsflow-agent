name: recsflow-agent

services:
  platform:
    build: .
    command: ["python", "-m", "uvicorn", "recagent.mock_platform:app", "--host", "0.0.0.0", "--port", "8090"]
    ports: ["127.0.0.1:8090:8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  demo:
    build: .
    ports: ["127.0.0.1:8501:8501"]
    environment:
      RECAGENT_PROVIDER: recsflow
      RECAGENT_PROVIDER_URL: http://platform:8090
      # Explicit capability of the bundled mock; no production API claim.
      RECAGENT_PROVIDER_VERIFIED_TITLE_LOOKUP: "true"
      RECAGENT_MODE: ${RECAGENT_MODE:-ollama}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      RECAGENT_CATALOG_GAP_LOG_PATH: /app/runtime/catalog-gaps/demo.jsonl
    volumes:
      - ./runtime/catalog-gaps:/app/runtime/catalog-gaps
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      platform:
        condition: service_healthy
  api:
    build: .
    command: ["python", "-m", "uvicorn", "recagent.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    environment:
      RECAGENT_PROVIDER: recsflow
      RECAGENT_PROVIDER_URL: http://platform:8090
      # Explicit capability of the bundled mock; no production API claim.
      RECAGENT_PROVIDER_VERIFIED_TITLE_LOOKUP: "true"
      RECAGENT_MODE: ${RECAGENT_MODE:-ollama}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      RECAGENT_CATALOG_GAP_LOG_PATH: /app/runtime/catalog-gaps/api.jsonl
    volumes:
      - ./runtime/catalog-gaps:/app/runtime/catalog-gaps
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      platform:
        condition: service_healthy
