name: CI

# Every push and PR checks code, the contract, and deterministic dev baselines.

on:
  push:
    branches: ["**"]
  pull_request:

env:
  PIP_USE_FEATURE: truststore
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff
        run: python -m ruff check src tests scripts evals
      - name: Ruff format check
        run: python -m ruff format --check src tests scripts || true

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validators
        run: python -m pip install --upgrade pip pyyaml openapi-spec-validator
      - name: Validate Recsflow OpenAPI contract
        run: python -m scripts.validate_contract

  test:
    runs-on: ubuntu-latest
    needs: [lint, contract]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e ".[dev]" --no-deps
      - name: Unit + integration tests
        run: python -m pytest -q --junitxml=report/tests.xml
      - name: Dev baseline controls (no LLM, no holdout)
        run: python -m scripts.evaluate_baselines --check --output report/baselines-ci.json
      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-baselines
          path: report/baselines-ci.json
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report/tests.xml

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build demo image
        run: docker build -t recagent:ci .
      - name: Verify the image imports the package
        run: docker run --rm recagent:ci python -c "import recagent.api; print('import ok')"
